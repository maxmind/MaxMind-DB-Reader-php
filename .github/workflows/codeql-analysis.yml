name: "Code scanning - action"

on:
  pull_request:
  schedule:
    - cron: '0 7 * * 2'

permissions:
  security-events: write # Used by this action.

jobs:
  CodeQL-Build:

    runs-on: ubuntu-latest

    steps:
    - name: Setup PHP
      uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
      with:
        php-version: '8.4'
        tools: phpize

    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install libmaxminddb
      run: sudo apt-get update && sudo apt-get install -y libmaxminddb-dev

    - name: Initialize CodeQL
      uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
      with:
        languages: c-cpp

    # A PHP extension is not built by CodeQL's Autobuild, so we build it
    # explicitly (mirroring this repo's other C build workflows) between the
    # init and analyze steps so CodeQL can trace the compilation.
    - name: Build extension
      run: |
            cd ext
            phpize
            ./configure --with-maxminddb --enable-maxminddb-debug
            make

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
