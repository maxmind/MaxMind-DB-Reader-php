name: PHPUnit

on:
  push:
  pull_request:
  schedule:
    - cron: '45 3 * * SUN'

permissions: {}

jobs:
  run:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
        php-version: ['7.2', '7.3', '7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5']
        php-extension: ['bcmath', 'gmp']
        include:
          # The runner's PHP loads gmp by default, and the decoder uses gmp
          # when it is loaded. Disable gmp so that the bcmath path runs.
          - php-extension: bcmath
            disabled-extensions: ':gmp'
          # Two PHP versions on each OS are enough to find platform problems.
          - { os: macos-latest, php-version: '8.1', php-extension: gmp }
          - { os: macos-latest, php-version: '8.5', php-extension: gmp }
          - { os: windows-latest, php-version: '8.1', php-extension: gmp }
          - { os: windows-latest, php-version: '8.5', php-extension: gmp }

    name: "PHP ${{ matrix.php-version }} (with ${{ matrix.php-extension }}) test on ${{ matrix.os }}"
    defaults:
      run:
        shell: bash
    steps:
      - name: Install PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php-version }}
          extensions: "mbstring, intl, ${{ matrix.php-extension }}, ${{ matrix.disabled-extensions }}"
          tools: "composer, phpize"

      # Without gmp or bcmath, ReaderTest marks its uint128 value checks
      # incomplete, and the run still passes. If gmp is loaded, the decoder
      # uses it, and a bcmath job does not test bcmath.
      - name: Check the math extension
        env:
          MATH_EXTENSION: ${{ matrix.php-extension }}
        run: |
              php -r '
                $ext = getenv("MATH_EXTENSION");
                if (!extension_loaded($ext)) {
                    echo "::error::$ext is not loaded\n";
                    exit(1);
                }
                if ($ext === "bcmath" && extension_loaded("gmp")) {
                    echo "::error::gmp is loaded, so the decoder does not use bcmath\n";
                    exit(1);
                }
              '

      - name: Checkout
        # We use v1 due to https://github.com/actions/checkout/issues/334
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - name: Install libmaxminddb from git
        if: runner.os == 'Linux'
        run: |
              mkdir -p "$HOME/libmaxminddb"
              git clone --recursive https://github.com/maxmind/libmaxminddb.git
              cd libmaxminddb
              ./bootstrap
              ./configure --prefix="$HOME/libmaxminddb"
              make
              make install
              echo "CFLAGS=-L$HOME/libmaxminddb/lib" >> "$GITHUB_ENV"
              echo "CPPFLAGS=-I$HOME/libmaxminddb/include" >> "$GITHUB_ENV"

      # configure finds the Homebrew libmaxminddb through pkg-config.
      - name: Install libmaxminddb from Homebrew
        if: runner.os == 'macOS'
        run: brew install libmaxminddb pkgconf

      # Windows can only build the bundled extension. test-bundled.yml tests
      # that DLL.
      - name: Build extension
        if: runner.os != 'Windows'
        run: |
              cd ext
              phpize
              ./configure --with-maxminddb --enable-maxminddb-debug
              make clean
              make
              ../dev-bin/run-ext-tests.sh
              cd ..

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: Test with phpunit without extension
        run: php vendor/bin/phpunit

      - name: Test with phpunit using extension
        if: runner.os != 'Windows'
        run: php -d extension=ext/modules/maxminddb.so vendor/bin/phpunit
