version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '14:00'
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '14:00'
    cooldown:
      default-days: 7
    groups:
      codeql:
        patterns:
          - github/codeql-action*
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '14:00'
    cooldown:
      default-days: 7
    ignore:
      # libmaxminddb is pinned to release tags and compiled into the
      # extension. Dependabot moves submodules to the latest commit on the
      # tracked branch when no newer tag exists, which would take us off
      # release tags.
      - dependency-name: ext/libmaxminddb
